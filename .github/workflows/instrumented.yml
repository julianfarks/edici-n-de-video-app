name: Instrumented tests (emulator)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  export-on-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Generate a sample video (3 s, 640x360, with audio)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p app/src/androidTest/assets
          ffmpeg -y -f lavfi -i testsrc=duration=3:size=640x360:rate=30 -f lavfi -i sine=frequency=440:duration=3 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest app/src/androidTest/assets/sample.mp4
      - name: Generate preview test media (146 s horizontal with audio, 5 s vertical)
        run: |
          ffmpeg -y -f lavfi -i testsrc2=duration=146.3:size=640x360:rate=24 -f lavfi -i sine=frequency=330:duration=146.3 \
            -c:v libx264 -preset ultrafast -crf 30 -pix_fmt yuv420p -g 24 -c:a aac -b:a 64k -shortest app/src/androidTest/assets/long.mp4
          ffmpeg -y -f lavfi -i testsrc=duration=5:size=360x640:rate=24 -f lavfi -i sine=frequency=550:duration=5 \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest app/src/androidTest/assets/vertical.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 app/src/androidTest/assets/long.mp4
      - name: Generate a 120 BPM drum loop (kick + hats) as an AAC song
        run: |
          ffmpeg -y -f lavfi -i "aevalsrc='0.9*sin(2*PI*(45+140*exp(-30*mod(t,0.5)))*mod(t,0.5))*exp(-9*mod(t,0.5))+0.22*(random(1)*2-1)*exp(-70*mod(t+0.25,0.5))':s=44100:d=10" \
            -c:a aac -b:a 128k app/src/androidTest/assets/song.m4a
          ffprobe -v error -show_entries format=duration -of csv=p=0 app/src/androidTest/assets/song.m4a
      - name: Generate Spanish speech (synthetic) with a pause, muxed into a video
        run: |
          sudo apt-get install -y -qq espeak-ng
          espeak-ng -v es-419 -s 150 -w /tmp/p1.wav "Hola amigos, bienvenidos a mi canal."
          espeak-ng -v es-419 -s 150 -w /tmp/p2.wav "Hoy vamos a editar un video muy rapido."
          ffmpeg -y -i /tmp/p1.wav -i /tmp/p2.wav -filter_complex "[0:a]aresample=44100,apad=pad_dur=3.0[a];[1:a]aresample=44100[b];[a][b]concat=n=2:v=0:a=1,apad=whole_dur=9[o]" -map "[o]" /tmp/speech.wav
          ffmpeg -y -f lavfi -i color=c=0x203040:size=640x360:rate=30:duration=9 -i /tmp/speech.wav -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest app/src/androidTest/assets/speech.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 app/src/androidTest/assets/speech.mp4
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p ci-logs
            ./gradlew --no-daemon --console=plain :app:connectedDebugAndroidTest 2>&1 | tee ci-logs/instrumented.log
      - name: Publish logs to the ci-logs-instrumented branch
        if: always()
        run: |
          mkdir -p ci-logs
          [ -d app/build/outputs/androidTest-results ] && cp -r app/build/outputs/androidTest-results ci-logs/results || true
          echo "run ${{ github.run_id }} sha ${{ github.sha }}" > ci-logs/INFO.txt
          cd ci-logs
          git init -q -b ci-logs-instrumented
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "instrumented logs ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-instrumented
