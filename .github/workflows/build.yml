name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: |
          set -o pipefail
          mkdir -p ci-logs
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest 2>&1 | tee ci-logs/unit-tests.log
      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain :app:assembleDebug 2>&1 | tee ci-logs/assemble.log
      - name: Lint (informational)
        continue-on-error: true
        run: ./gradlew --no-daemon :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vanta-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Publish build logs to the ci-logs branch
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p ci-logs
          for r in app/build/test-results/testDebugUnitTest; do [ -d "$r" ] && cp -r "$r" ci-logs/test-results || true; done
          grep -hE "^e: |^w: .*(deprecat|unchecked)" ci-logs/*.log | head -300 > ci-logs/errors.txt || true
          echo "run ${{ github.run_id }} sha ${{ github.sha }}" > ci-logs/INFO.txt
          cd ci-logs
          git init -q -b ci-logs
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "logs for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
