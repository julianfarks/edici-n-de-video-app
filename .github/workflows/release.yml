name: Release

# Publishes an installable APK as a GitHub Release.
#   - push a tag like v0.1.0-alpha, or push to the `release` branch (publishes v0.3.0-alpha), or
#   - run manually from the Actions tab and give the tag.
# Signing: if the repository secrets below exist the APK is signed with that key, otherwise it is
# signed with the debug key (fine for testing, not for the Play Store). No key is ever committed.
#   VANTA_KEYSTORE_BASE64, VANTA_KEYSTORE_PASSWORD, VANTA_KEY_ALIAS, VANTA_KEY_PASSWORD

on:
  push:
    tags: ['v*']
    branches: [release]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.3.0-alpha)
        required: true
        default: v0.3.0-alpha

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.3.0-alpha' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Decode signing key (optional)
        env:
          KS_B64: ${{ secrets.VANTA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "VANTA_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "VANTA_KEYSTORE_PASSWORD=${{ secrets.VANTA_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "VANTA_KEY_ALIAS=${{ secrets.VANTA_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "VANTA_KEY_PASSWORD=${{ secrets.VANTA_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "No release key configured: using the debug key."
          fi
      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/VantaStudio-${TAG}.apk"
          (cd dist && sha256sum "VantaStudio-${TAG}.apk" > "VantaStudio-${TAG}.apk.sha256")
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: vanta-studio-release-apk
          path: dist/*
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Alpha build of Vanta Studio. See CHANGELOG.md for what works and what is still missing. Install by allowing 'unknown sources' for your browser/file manager."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Vanta Studio $TAG" --notes "$NOTES" --prerelease --target "${GITHUB_SHA}"
          fi
